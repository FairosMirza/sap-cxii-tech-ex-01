# Scorer configuration. Weights are untuned starting points: block weights are
# chosen later on the development queries; attribute sub-weights stay fixed.
scoring:
  block_weights: {text: 0.5, image: 0.0, attributes: 0.5}
  # Product type dominates; price tier, brand and colour refine; weight is 79% missing.
  attribute_weights: {category: 0.4, price: 0.2, brand: 0.15, color: 0.15, weight: 0.1, rating: 0.0}
  # If the evidence both products share covers less than this fraction of the total
  # weight, the missing part counts as zero similarity.
  min_evidence: 0.5
  # ln 2: a component falls to 1/e when one product's price (or weight) is double the other's.
  price_scale: 0.6931
  weight_scale: 0.6931

eligibility:
  exclude_same_asin: true
  # Variant families are products sharing brand and normalised title (mostly size variants).
  exclude_query_family: true
  max_per_family: 1
  # Optional result-diversity rule (results per normalised title). Off for the primary comparison;
  # 2 is an experimental setting, compared later with human relevance and redundancy judgements.
  max_per_title: null
  max_results: 100
  # docs/decisions.md D08: approximate search becomes the default only at >= 0.95 coverage of exact results.
  search_mode: exact
  ann_candidates: 200

# What the HTTP service runs, chosen on the development labels (decisions D07, D09). bge-small serves both endpoints.
serving:
  similar_method: C_bge
  semantic_model: bge-small
  # D08: approximate search is the default where it returns >= 95% of the exact top-10
  # (reports/ann_benchmark.json); requests can still ask for mode=exact. Evaluation always ranks exactly.
  similar_search: {mode: ann, candidates: 800}
  semantic_search: {mode: ann, candidates: 200}

# Approaches compared during development; each overrides the settings above.
# C uses sentence embeddings; both small models are pooled for labelling (see reports/text_model_comparison.json).
methods:
  A_structured:
    block_weights: {text: 0.0, image: 0.0, attributes: 1.0}
  B_tfidf:
    block_weights: {text: 0.5, image: 0.0, attributes: 0.5}
    text_model: tfidf
  C_minilm:
    block_weights: {text: 0.5, image: 0.0, attributes: 0.5}
    text_model: minilm
  C_bge:
    block_weights: {text: 0.5, image: 0.0, attributes: 0.5}
    text_model: bge-small
